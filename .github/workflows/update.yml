name: Update Nobody's Law

on:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "postprocess.py"
      - "qa-banner.webp"
      - "qa-banner.jpeg"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build site from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: "3c5a36e22f8980faa373c5a3b63518d3"
        run: |
          python build.py
          python postprocess.py

      - name: Commit updated site
        run: |
          git config user.name "nobodys-law-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update from Notion"
            git push
          fi
